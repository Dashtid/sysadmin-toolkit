name: Security Scanning

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly on Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

# Least privilege by default. codeql-analysis and trivy-scan add
# security-events: write at job level; nothing here needs more.
permissions:
  contents: read

jobs:
  # Secret Detection (merged from secret-scan.yml)
  secret-detection:
    name: Secret Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@bcfcf73aaf4759d4dadc2783177c245a02792318  # v3.97.0
        continue-on-error: true
        with:
          path: ./
          base: ${{ github.event.before }}
          head: HEAD
          extra_args: --only-verified

      - name: Scan for common secret patterns
        run: |
          echo "[i] Scanning for common secrets patterns..."

          PATTERNS=(
            "password\s*=\s*['\"][^'\"]*['\"]"
            "api[_-]?key\s*=\s*['\"][^'\"]*['\"]"
            "secret\s*=\s*['\"][^'\"]*['\"]"
            "token\s*=\s*['\"][^'\"]*['\"]"
            "BEGIN RSA PRIVATE KEY"
            "BEGIN OPENSSH PRIVATE KEY"
          )

          FOUND=0

          for pattern in "${PATTERNS[@]}"; do
            if grep -rniE "$pattern" . \
              --exclude-dir=.git \
              --exclude-dir=node_modules \
              --exclude-dir=tests \
              --exclude-dir=.githooks \
              --exclude="*.md" \
              --exclude="*.yml"; then
              echo "[-] Found potential secret: $pattern"
              FOUND=1
            fi
          done

          if [ $FOUND -eq 1 ]; then
            echo "[-] Potential secrets found - review required"
            exit 1
          fi

          echo "[+] No secrets detected"

  # CodeQL Analysis
  codeql-analysis:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28  # v4.37.8
        with:
          languages: python
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28  # v4.37.8

  # Dependency Review (PRs only)
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        continue-on-error: true
        with:
          fail-on-severity: moderate

  # Trivy Vulnerability Scanner
  trivy-scan:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        continue-on-error: true
        env:
          # Use the ECR mirror to dodge GHCR rate limits (the dominant
          # trivy-action CI failure mode in 2025-2026).
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          # Advisory mode on a personal toolkit: findings surface in the
          # GitHub Security tab via SARIF upload below, but don't gate merges.
          ignore-unfixed: 'true'
          exit-code: '0'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28  # v4.37.8
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # Check for outdated PowerShell modules
  powershell-modules-check:
    name: Check PowerShell Modules
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check for module updates
        shell: pwsh
        run: |
          Write-Host "[i] Checking for PowerShell module updates..."

          $modules = @('Pester', 'PSScriptAnalyzer')
          $outdated = @()

          foreach ($module in $modules) {
            try {
              $installed = Get-InstalledModule -Name $module -ErrorAction SilentlyContinue
              $available = Find-Module -Name $module -ErrorAction Stop

              if ($installed -and ($available.Version -gt $installed.Version)) {
                Write-Host "[!] $module is outdated: $($installed.Version) -> $($available.Version)"
                $outdated += $module
              } else {
                Write-Host "[+] $module is up to date"
              }
            } catch {
              Write-Host "[!] Could not check $module : $_"
            }
          }

          if ($outdated.Count -gt 0) {
            Write-Host "[!] $($outdated.Count) module(s) have updates available"
          } else {
            Write-Host "[+] All modules are up to date"
          }

  # License Compliance
  license-check:
    name: License Compliance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check for LICENSE file
        run: |
          if [ ! -f LICENSE ]; then
            echo "[-] LICENSE file not found"
            exit 1
          fi
          echo "[+] LICENSE file exists"

      - name: Verify LICENSE is MIT
        run: |
          if grep -q "MIT License" LICENSE; then
            echo "[+] MIT License confirmed"
          else
            echo "[!] License type verification needed"
          fi

  # Markdown Link Checker
  markdown-links:
    name: Check Markdown Links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@3c3b66f1f7d0900e37b71eca45b63ea9eedfce31  # 1.0.17
        with:
          use-quiet-mode: 'yes'
          config-file: '.github/markdown-link-check-config.json'

  # Security Summary
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [secret-detection, codeql-analysis, trivy-scan, license-check]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "# Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scanner | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Secrets | ${{ needs.secret-detection.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL  | ${{ needs.codeql-analysis.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy   | ${{ needs.trivy-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| License | ${{ needs.license-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View details in the Security tab" >> $GITHUB_STEP_SUMMARY

      # The summary above is a report, not a gate. Without this step the job
      # concludes success even when a scanner failed, so requiring "Security
      # Summary" as a branch-protection check would be false assurance.
      # Deliberately gates on the four security-critical scanners only -
      # markdown-links and powershell-modules-check stay advisory so external
      # link rot and module drift cannot block a merge.
      - name: Gate on scanner results
        run: |
          set -euo pipefail
          failed=0
          for entry in \
            "Secret Detection=${{ needs.secret-detection.result }}" \
            "CodeQL=${{ needs.codeql-analysis.result }}" \
            "Trivy=${{ needs.trivy-scan.result }}" \
            "License Compliance=${{ needs.license-check.result }}"; do
            name="${entry%%=*}"; result="${entry##*=}"
            if [ "$result" != "success" ]; then
              echo "::error::$name concluded '$result'"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "[-] security gate failed"
            exit 1
          fi
          echo "[+] all security scanners passed"
